<div class="container">
  <app-header [dark]="true" />

  <div class="content">
    <div class="content-inner">
      <div class="image-wrapper">
        <img src="/confirmImage.png" alt="Confirmation" />
      </div>

      <div class="text-wrapper">
        <h1>
          Sua presença <br />
          nesse dia é mais <br />
          que especial!
        </h1>
        <p class="confirmation-text">
          Pedimos que confirme o <br />
          mais rápido que puder,<br />
          assim que tiver certeza.
        </p>
      </div>
    </div>

    <div class="right-panel">
      <p class="loading-text" *ngIf="loading">Carregando convidados...</p>
      <p class="error-text" *ngIf="error">Erro ao carregar. Recarregue a página.</p>

      <div class="search-container" *ngIf="!loading && !error && !selectedGuest">
        <input
          type="text"
          placeholder="Busque seu nome..."
          [(ngModel)]="searchTerm"
          (input)="filterList()"
          class="search-input"
        />
        <ul class="results">
          <li *ngFor="let guest of filteredGuests">
            <button type="button" class="guest-button" (click)="selectGuest(guest)">
              {{ guest.nome }}
            </button>
          </li>
        </ul>
      </div>

      <div class="confirm-panel" *ngIf="selectedGuest && !confirmationSent">
        <p class="panel-name">{{ selectedGuest.nome }}</p>
        <button type="button" class="confirm-button" (click)="confirmPresence()">Confirmar?</button>
        <button type="button" class="back-button" (click)="goBack()">← Voltar</button>
      </div>

      <div class="success-panel" *ngIf="confirmationSent">
        <p class="panel-name">{{ selectedGuest?.nome }}</p>
        <p class="success-label">Confirmado!</p>
        <p class="success-message">Estamos animados para te ver no nosso dia!</p>
        <button type="button" class="back-button" (click)="goBack()">← Voltar</button>
      </div>
    </div>
  </div>
</div>
